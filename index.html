<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attari Classes CI/CD Demo</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 80px auto;
            padding: 40px 20px;
        }

        h1 {
            color: #1f4e79;
            font-size: 42px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 40px;
        }

        .flow {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 30px;
        }

        .step {
            background: white;
            padding: 18px 24px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            font-weight: bold;
            font-size: 18px;
        }

        .arrow {
            font-size: 28px;
            font-weight: bold;
            color: #1f4e79;
        }

        .footer {
            margin-top: 50px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Attari Classes</h1>
        <h2>CI/CD Demo</h2>

        <div class="flow">
            <div class="step">GitHub</div>
            <div class="arrow">→</div>
            <div class="step">CodePipeline</div>
            <div class="arrow">→</div>
            <div class="step">CodeBuild</div>
            <div class="arrow">→</div>
            <div class="step">S3</div>
        </div>

        <div class="footer">
            AWS CI/CD Static Website Demo
        </div>
    </div>
</body>
</html>
