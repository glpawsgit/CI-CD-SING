version: 0.2

phases:
  build:
    commands:
      - echo "Checking whether index.html exists..."
      - |
        if [ ! -f index.html ]; then
          echo "ERROR: index.html not found!"
          exit 1
        fi

      - echo "Checking for 'Attari Classes' in index.html..."
      - |
        if ! grep -q "Attari Classes" index.html; then
          echo "ERROR: 'Attari Classes' text not found in index.html!"
          exit 1
        fi

      - echo "SUCCESS: index.html exists and contains 'Attari Classes'."

artifacts:
  files:
    - index.html
